name: Quarkus CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quarkus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: opet290999
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d quarkus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Grant Execute Permission
        run: chmod +x mvnw

      - name: Check Docker Containers
        run: docker ps -a

      - name: Check PostgreSQL
        run: |
          pg_isready -h localhost -p 5432 -U postgres || true

      - name: Check Port
        run: |
          nc -zv localhost 5432 || true

      - name: Print Quarkus Profile
        run: |
          echo "QUARKUS_PROFILE=$QUARKUS_PROFILE"

      - name: Run Tests
        env:
          QUARKUS_DATASOURCE_DB_KIND: postgresql
          QUARKUS_DATASOURCE_USERNAME: postgres
          QUARKUS_DATASOURCE_PASSWORD: opet290999
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/quarkus
        run: ./mvnw clean verify
