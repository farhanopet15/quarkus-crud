services:
  postgres:
    image: postgres:16
    container_name: quarkus-postgres

    restart: always

    environment:
      POSTGRES_DB: quarkus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: quarkus-pgadmin

    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - postgres

  quarkus-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: quarkus-api

    restart: always

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    environment:
      QUARKUS_PROFILE: docker

volumes:
  postgres_data:
